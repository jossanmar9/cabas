name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set -o pipefail
          ./gradlew --continue testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease 2>&1 | tee build.log
      - name: Resumix els errors
        if: failure()
        run: |
          {
            grep -E '^e: |FAILED|What went wrong|Error:|error:|Lint found' build.log | head -60 || true
            find app/build/test-results -name '*.xml' -exec grep -h -o '<failure message="[^"]\{0,6000\}' {} + 2>/dev/null | head -20 || true
            find app/build -name 'lint-results-*.txt' -exec head -60 {} + 2>/dev/null || true
          } > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Errors de compilació o proves::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: cabas-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports
      - name: TEMP esquema
        run: echo "::notice title=schema5::$(gzip -9c app/schemas/org.cabas.app.data.CabasDatabase/5.json | base64 -w0)"
