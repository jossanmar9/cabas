name: APK de prova
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - name: Publica l'APK de prova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cabas-prova.apk
          gh release delete prova --cleanup-tag --yes || true
          gh release create prova cabas-prova.apk --prerelease --target "$GITHUB_SHA" \
            --title "Cabàs (prova de la branca $GITHUB_REF_NAME)" \
            --notes "APK de desenvolupament per a provar abans de fusionar. No és una versió estable. Commit: $GITHUB_SHA"
