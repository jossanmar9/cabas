name: Release
on:
  push:
    tags: ['v*']
  # Publishes the version in versionName from the chosen branch, creating its tag.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprova que l'etiqueta coincidix amb la versió
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "L'etiqueta $tag no coincidix amb versionName $version" >&2; exit 1
            fi
          else
            tag="v$version"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Prepara la clau de signatura
        env:
          KEYSTORE_BASE64: ${{ secrets.CABAS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secret CABAS_KEYSTORE_BASE64. Consulta docs/RELEASING.md" >&2; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cabas-release.jks"
          echo "CABAS_KEYSTORE_FILE=$RUNNER_TEMP/cabas-release.jks" >> "$GITHUB_ENV"
      - name: Compila i prova
        env:
          CABAS_KEYSTORE_PASSWORD: ${{ secrets.CABAS_KEYSTORE_PASSWORD }}
          CABAS_KEY_ALIAS: ${{ secrets.CABAS_KEY_ALIAS }}
          CABAS_KEY_PASSWORD: ${{ secrets.CABAS_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Publica la versió
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="cabas-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$TAG" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "Cabàs $TAG" --generate-notes --latest
          fi
      - if: always()
        run: rm -f "$RUNNER_TEMP/cabas-release.jks"
